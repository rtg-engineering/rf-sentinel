[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-sentinel"
version = "0.1.0"
description = "RF Sentinel multi-protocol scanner orchestration"
requires-python = ">=3.10"
license = "LicenseRef-RF-Sentinel-Commercial"
dependencies = []

[project.optional-dependencies]
# Optional LLM provider for the read-only Analyst; deterministic analysis needs none of this.
analyst-llm = ["pydantic-ai-slim[anthropic,openai]>=2.74,<3; python_version >= '3.11'"]

[project.scripts]
rf-sentinel-scan = "rf_platform.scanner:main"
rf_sentinel_scan = "rf_platform.scanner:main"
rf-sentinel-pipeline = "rf_platform.pipeline:main"
rf_sentinel_pipeline = "rf_platform.pipeline:main"
rf-sentinel-ui = "rf_platform.ui:main"
rf_sentinel_ui = "rf_platform.ui:main"
rf-sentinel-analyst = "rf_platform.analyst.__main__:main"

[tool.setuptools.packages.find]
include = ["rf_platform*"]
